# Numo9 en-CA glossary — banned terms in en-CA catalogues (S-01-T10; gaps #31, #38).
# Source: Phase 0 plan §4 (Glossary lint) and A-10-T15.
# `pattern` is a Python regex; `case_sensitive` defaults to false.
# `allow` lists catalogue keys (frontend message id or backend msgid) where the term is accepted,
# each with a justification comment.

[[banned]]
term = "VAT"
pattern = '\bVAT\b|\bvalue[ -]added tax\b'
case_sensitive = false
use = "GST/HST (or QST for Québec)"
gap = "gap-31"

[[banned]]
term = "State"
pattern = '\bStates?\b'
case_sensitive = true
use = "Province (or Province/territory)"
gap = "gap-31"

[[banned]]
term = "ZIP"
# Upper-case ZIP only (".zip archive" is fine); "zip code" in any case.
pattern = '\bZIP\b|(?i:\bzip ?codes?\b)'
case_sensitive = true
use = "Postal code"
gap = "gap-31"

[[banned]]
term = "annual leave"
pattern = '\bannual leave\b'
use = "vacation (vacation pay)"
gap = "gap-31"

[[banned]]
term = "Organization"
pattern = '\borgani[sz]ations?\b'
# "organisation" is the single en-CA spelling; this pattern matches both, so exclude it below.
exclude = '\borganisations?\b'
use = "organisation"
gap = "gap-38"

[[banned]]
term = "Check(s)"
pattern = '\bChecks?\b'
case_sensitive = true
use = "cheque (payment instrument); for the verb use 'Verify' or 'Review'"
gap = "gap-31"

[[banned]]
term = "Advisor"
pattern = '\badvisors?\b'
use = "Accountant (practice role)"
gap = "gap-38"

# ---- A-10-T15: more en-CA variants -------------------------------------------------------

[[banned]]
term = "Postcode"
pattern = '\bpost ?codes?\b'
use = "Postal code"
gap = "gap-31"

[[banned]]
term = "Postal Code (title case)"
# Sentence case (microcopy rule 5): "Postal code", never "Postal Code".
pattern = '\bPostal Codes?\b'
case_sensitive = true
use = "Postal code"
gap = "gap-31"

[[banned]]
term = "HST/GST, GST-HST"
pattern = '\bHST\s*/\s*GST\b|\bGST\s+/\s*HST\b|\bGST\s*/\s+HST\b|\bGST-HST\b'
use = "GST/HST"
gap = "gap-31"

[[banned]]
term = "Checkbook"
pattern = '\bcheck ?books?\b'
use = "chequebook"
gap = "gap-31"

# ---- Preferred en-CA terms (A-10-T15) ------------------------------------------------------
# The words to use; each banned entry above points to one of these. `check_glossary.py --terms`
# prints this list for docs/design (the glossary the French reviewer extends in Phase 6).

[[preferred]]
term = "organisation"
meaning = "A business using Numo9 (the paying tenant)"
instead_of = "organization"

[[preferred]]
term = "cheque"
meaning = "The payment instrument (cheque number, print cheques)"
instead_of = "check (noun)"

[[preferred]]
term = "Province"
meaning = "Province or territory of an address or registration"
instead_of = "State"

[[preferred]]
term = "Postal code"
meaning = "Canadian postal code, A1A 1A1"
instead_of = "ZIP, ZIP code, postcode"

[[preferred]]
term = "GST/HST"
meaning = "Goods and services tax / harmonized sales tax (QST for Québec)"
instead_of = "VAT, sales tax (for GST/HST)"

[[preferred]]
term = "vacation pay"
meaning = "Vacation pay and vacation entitlement (payroll)"
instead_of = "annual leave, holiday pay (for vacation)"

[[preferred]]
term = "Accountant"
meaning = "Practice role of the firm's staff"
instead_of = "Advisor"
