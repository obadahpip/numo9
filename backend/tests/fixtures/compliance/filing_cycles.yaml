# G-03a-T22 — filing-cycle compliance fixtures. Expected periods are written by hand from
# docs/specs/filing-cycles.md (not produced by the engine); edit only with the accountant's sign-off.
description: 'Filing periods for the scenarios of G-03a: quarterly to monthly from 1 July; annual
  to quarterly mid-year (a stub); a financial year ending 31 March; a leap year; two switches in one
  year. Each step is a frequency switch, an out-of-cycle period or filing the first N periods.
  Due dates listed are the return due dates after the business-day roll (2026–2027 holiday data).'
today: '2026-06-01'
scenarios:
- name: quarterly_to_monthly_1_july
  registration: {start: '2026-01-01', stop: '2026-12-31', fye: '12-31'}
  steps:
  - {switch: quarterly, from: '2026-01-01'}
  - {file: 2}
  - {switch: monthly, from: '2026-07-01', approval_ref: '2026-GST-48812'}
  periods:
  - {start: '2026-01-01', end: '2026-03-31', kind: regular, status: filed, due: '2026-04-30'}
  - {start: '2026-04-01', end: '2026-06-30', kind: regular, status: filed, due: '2026-07-31'}
  - {start: '2026-07-01', end: '2026-07-31', kind: regular, due: '2026-08-31'}
  - {start: '2026-08-01', end: '2026-08-31', kind: regular, due: '2026-10-01'}  # 30 Sep: holiday
  - {start: '2026-09-01', end: '2026-09-30', kind: regular, due: '2026-11-02'}  # 31 Oct: Saturday
  - {start: '2026-10-01', end: '2026-10-31', kind: regular, due: '2026-11-30'}
  - {start: '2026-11-01', end: '2026-11-30', kind: regular, due: '2026-12-31'}
  - {start: '2026-12-01', end: '2026-12-31', kind: regular, due: '2027-02-01'}  # 31 Jan: Sunday
- name: annual_to_quarterly_mid_year_stub
  registration: {start: '2026-01-01', stop: '2027-12-31', fye: '12-31'}
  steps:
  - {switch: annual, from: '2026-01-01'}
  - {switch: quarterly, from: '2026-05-15', approval_ref: 'CRA-2026-0517'}
  periods:
  - {start: '2026-01-01', end: '2026-05-14', kind: stub}
  - {start: '2026-05-15', end: '2026-06-30', kind: stub, due: '2026-07-31'}
  - {start: '2026-07-01', end: '2026-09-30', kind: regular, due: '2026-11-02'}
  - {start: '2026-10-01', end: '2026-12-31', kind: regular, due: '2027-02-01'}
  - {start: '2027-01-01', end: '2027-03-31', kind: regular, due: '2027-04-30'}
