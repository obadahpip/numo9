  - {start: '2027-07-01', end: '2027-09-30', kind: regular}
  - {start: '2027-10-01', end: '2027-12-31', kind: regular}
- name: financial_year_ending_31_march
  registration: {start: '2026-01-01', stop: '2028-03-31', fye: '03-31'}
  steps:
  - {switch: annual, from: '2026-01-01'}
  - {switch: quarterly, from: '2027-04-01'}  # a financial year start: no approval needed
  periods:
  - {start: '2026-01-01', end: '2026-03-31', kind: stub, due: '2026-06-30'}
  - {start: '2026-04-01', end: '2027-03-31', kind: regular, due: '2027-06-30'}
