[project]
name = "numo9-backend"
version = "0.0.0"
description = "Numo9 platform backend (Django)"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "staticfiles", "media"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "C4",  # comprehensions
  "SIM", # simplify
  "DJ",  # flake8-django
  "S",   # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"] # assert and subprocess are expected in tests
"*/settings/*.py" = ["F405"]  # star-imported names from base settings
"*/migrations/*.py" = ["E501"] # generated by makemigrations (long help_text strings)
"*/waffle_migrations/*.py" = ["E501"] # generated for django-waffle (U-06-T12)

[tool.ruff.lint.isort]
known-first-party = ["numo9"]

[tool.mypy]
python_version = "3.12"
# The backend runs only in Linux containers: type-check for Linux on every machine (os.killpg,
# signal.SIGKILL do not exist on Windows, where pre-commit also runs mypy).
platform = "linux"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/", "^staticfiles/"]
# tools/ci scripts imported by tests (S-03-T10 header grader).
mypy_path = "../tools/ci"

[[tool.mypy.overrides]]
# django-allauth and qrcode ship no type information (A-02).
module = ["allauth", "allauth.*", "qrcode", "qrcode.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django-anymail ships no type information (A-07-T03).
module = ["anymail", "anymail.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django-treebeard ships no type information (V-02-T02).
module = ["treebeard", "treebeard.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no type information (A-08-T01).
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django-celery-beat ships no type information (A-08-T05).
module = ["django_celery_beat", "django_celery_beat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# openpyxl ships no type information (A-04-T08 exports).
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# WeasyPrint ships no type information (A-10-T16).
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Object storage, file type detection, previews and the test S3 server ship no type information
# (A-06): django-storages, boto3/botocore, python-magic, pillow-heif, pypdfium2, moto, requests.
module = [
  "storages", "storages.*", "boto3", "boto3.*", "botocore", "botocore.*", "magic",
  "pillow_heif", "pillow_heif.*", "pypdfium2", "pypdfium2.*", "moto", "moto.*",
  "requests", "requests.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "numo9.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "numo9.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gap(*ids): gap-closure test for xero_teardown gap(s), e.g. @pytest.mark.gap('gap-06'); run by the CI gap-tests job",
  "data_validation: cross-report data validation (one figure, two reports); B-02-T13 statement = AR aging",
  "tenant_isolation: cross-tenant isolation test; run by the CI tenant-sweep job (A-01 adds manage.py tenant_sweep)",
  "compliance: tax compliance fixtures (tests/fixtures/compliance/*.yaml, G-01-T15)",
]

# ---- import-linter (C-02-T14): run `lint-imports` from backend/ ------------------------------
[tool.importlinter]
root_package = "numo9"
include_external_packages = false
contract_types = ["ledger_writes: tools.import_contracts.LedgerWritesContract"]

[[tool.importlinter.contracts]]
name = "Only numo9.ledger.services writes JournalLine (ADR-0003)"
type = "ledger_writes"
models_module = "numo9.ledger.models"
# numo9.scale.fixtures (S-06-T08): the scratch-only perf fixture inserts posted lines with
# generate_series the way the engine writes them (drafts, lines, then Posted) — never real books.
allowed_modules = ["numo9.ledger.services", "numo9.scale.fixtures"]
