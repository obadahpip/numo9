# pre-commit hooks — install once per clone:  pre-commit install
# Run on everything:                           pre-commit run --all-files
# Prerequisites: backend venv with requirements/dev.txt (provides pre-commit), and `pnpm install`
# at the repository root (provides eslint and prettier).

# Client documents and the task tracker are not reformatted.
exclude: ^(docs/.*\.docx|To_delete/.*)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(docs/|status\.txt$)
      - id: trailing-whitespace
        exclude: ^(docs/|status\.txt$)
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      # mkdocs.yml uses a !!python/name tag (Mermaid fence): syntax-only check (S-01-T17).
      - id: check-yaml
        name: check yaml (mkdocs.yml, syntax only)
        args: ["--unsafe"]
        files: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^(backend|tools)/.*\.py$
      - id: ruff-format
        files: ^(backend|tools)/.*\.py$

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict + django-stubs)
        language: python
        entry: python tools/precommit/run_in.py backend python -m mypy .
        pass_filenames: false
        files: ^backend/.*\.py$
        additional_dependencies:
          - mypy==2.4.1
          - django-stubs[compatible-mypy]==6.1.2
          - djangorestframework==3.18.3
          - djangorestframework-stubs==3.18.1
          - drf-spectacular==0.30.0
          - Django==5.2.19
          - dj-database-url==2.3.0
          - pytest==9.2.0
          - pytest-django==4.14.0
          - hypothesis==6.170.10
          - pypdf==6.21.4 # A-10-T16 PDF tests
          - cryptography==50.0.2 # S-03-T04 EncryptedField
          - structlog==26.1.0 # S-03-T06 log scrubbing
          - sentry-sdk[django]==2.73.0 # S-03-T06 Sentry before_send
          - django-migration-linter==6.0.0 # imported by numo9.settings.test (mypy plugin loads it)
          - django-allauth==65.21.1 # A-02 sign-up/login/reset/2FA (headless)
          - argon2-cffi==25.1.0 # A-02-T02 Argon2id hasher
          - qrcode==8.2 # A-02-T05 TOTP QR code
          - fido2==2.2.1 # A-02-T05 imported by allauth.mfa
          - redis==8.1.0 # A-02-T03 shared cache
          - celery==5.6.3 # A-08 imported by numo9.settings.base (celery.schedules)
          - django-celery-beat==2.9.0 # A-08-T05 installed app (mypy plugin loads it)
          - psycopg[binary]==3.3.8 # A-08 tests import psycopg

      - id: eslint
        name: eslint (frontend)
        language: system
        entry: python tools/precommit/run_in.py frontend pnpm exec eslint --max-warnings=0 --no-warn-ignored --
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs)$

      - id: prettier
        name: prettier (frontend, mobile)
        language: system
        entry: python tools/precommit/run_in.py . pnpm exec prettier --write --ignore-unknown --
        files: ^(frontend|mobile)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: local
    hooks:
      - id: check-secrets
        name: check secrets (SOPS files encrypted, no keys or .env committed; S-03-T03)
        language: system
        entry: python3 tools/ci/check_secrets.py .
        pass_filenames: false
        always_run: true
