# Numo9 documentation site (S-01-T17). Build: `make docs`  ·  Preview: `make docs-serve`
site_name: Numo9 documentation
site_description: Numo9 platform — engineering, architecture decisions and phase plans
repo_url: https://github.com/obadahpip/numo9
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

# Client contracts (.docx) and tooling files are never published to the site.
exclude_docs: |
  *.docx
  requirements.txt

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

