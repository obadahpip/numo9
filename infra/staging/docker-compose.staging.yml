# Numo9 staging stack — minimal version for S-01-T12 tag deploys.
# S-02-T06 extends it (worker, beat, caddy/TLS, clamav, SOPS secrets, managed PostgreSQL).
#
# Contract with infra/deploy/deploy.sh (see infra/deploy/README.md):
#   - images are tagged ${NUMO9_TAG} (exported by deploy.sh)
#   - service `backend` runs migrations
#   - secrets come from .env next to this file (created on the host, never committed)
name: numo9-staging

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: numo9
      POSTGRES_USER: numo9
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numo9 -d numo9"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/obadahpip/numo9-backend:${NUMO9_TAG:?NUMO9_TAG is set by deploy.sh}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: numo9.settings.staging
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # S-03: values come from .env, which deploy.sh decrypts from infra/secrets/staging.sops.env.
      DJANGO_SECRET_KEY_FALLBACKS: ${DJANGO_SECRET_KEY_FALLBACKS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      NUMO9_FIELD_ENCRYPTION_KEYS: ${NUMO9_FIELD_ENCRYPTION_KEYS:-}
      NUMO9_FIELD_ENCRYPTION_ACTIVE_KEY: ${NUMO9_FIELD_ENCRYPTION_ACTIVE_KEY:-}
      # S-03-T06: scrubbed JSON logs; Sentry only when a DSN is set.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NUMO9_RELEASE: ${NUMO9_TAG}
      DATABASE_URL: postgres://numo9:${POSTGRES_PASSWORD}@postgres:5432/numo9
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/obadahpip/numo9-frontend:${NUMO9_TAG:?NUMO9_TAG is set by deploy.sh}
    restart: unless-stopped
    environment:
      # S-03-T02: "report-only" for the first week on a new environment, then "enforce".
      NUMO9_CSP_MODE: ${NUMO9_CSP_MODE:-enforce}
      # Extra https origins the browser calls (e.g. the API), comma-separated.
      NUMO9_CSP_CONNECT_SRC: ${NUMO9_CSP_CONNECT_SRC:-}
      # A-06: the files bucket origin (uploads and previews), e.g. https://files.numo9.ca.
      NUMO9_CSP_STORAGE_SRC: ${NUMO9_CSP_STORAGE_SRC:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
