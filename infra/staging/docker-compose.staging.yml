# Numo9 staging stack — minimal version for S-01-T12 tag deploys.
# S-02-T06 extends it (worker, beat, caddy/TLS, clamav, SOPS secrets, managed PostgreSQL).
#
# Contract with infra/deploy/deploy.sh (see infra/deploy/README.md):
#   - images are tagged ${NUMO9_TAG} (exported by deploy.sh)
#   - service `backend` runs migrations
#   - secrets come from .env next to this file (created on the host, never committed)
name: numo9-staging

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    # Server connections are PgBouncer's pool (60 at most) plus maintenance and migrations.
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: numo9
      POSTGRES_USER: numo9
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numo9 -d numo9"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S-06-T01: PgBouncer in transaction pooling mode between Django and PostgreSQL — hundreds of
  # client connections (gunicorn and Celery workers) share a small pool of server connections.
  # Django's settings for it: NUMO9_DB_POOL=pgbouncer (numo9/settings/database.py,
  # docs/operations/pgbouncer.md).
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: numo9
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DB_NAME: numo9
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "10"
      MAX_DB_CONNECTIONS: "60"
      SERVER_RESET_QUERY: ""
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U numo9 -d numo9"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/obadahpip/numo9-backend:${NUMO9_TAG:?NUMO9_TAG is set by deploy.sh}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: numo9.settings.staging
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # S-03: values come from .env, which deploy.sh decrypts from infra/secrets/staging.sops.env.
      DJANGO_SECRET_KEY_FALLBACKS: ${DJANGO_SECRET_KEY_FALLBACKS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      NUMO9_FIELD_ENCRYPTION_KEYS: ${NUMO9_FIELD_ENCRYPTION_KEYS:-}
      NUMO9_FIELD_ENCRYPTION_ACTIVE_KEY: ${NUMO9_FIELD_ENCRYPTION_ACTIVE_KEY:-}
      # S-03-T06: scrubbed JSON logs; Sentry only when a DSN is set.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NUMO9_RELEASE: ${NUMO9_TAG}
      # Through PgBouncer (transaction pooling, S-06-T01); migrations run through it too (each
      # migration is one transaction).
      DATABASE_URL: postgres://numo9:${POSTGRES_PASSWORD}@pgbouncer:6432/numo9
      NUMO9_DB_POOL: pgbouncer
      DJANGO_CONN_MAX_AGE: ${DJANGO_CONN_MAX_AGE:-300}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/obadahpip/numo9-frontend:${NUMO9_TAG:?NUMO9_TAG is set by deploy.sh}
    restart: unless-stopped
    environment:
      # S-03-T02: "report-only" for the first week on a new environment, then "enforce".
      NUMO9_CSP_MODE: ${NUMO9_CSP_MODE:-enforce}
      # Extra https origins the browser calls (e.g. the API), comma-separated.
      NUMO9_CSP_CONNECT_SRC: ${NUMO9_CSP_CONNECT_SRC:-}
      # A-06: the files bucket origin (uploads and previews), e.g. https://files.numo9.ca.
      NUMO9_CSP_STORAGE_SRC: ${NUMO9_CSP_STORAGE_SRC:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
