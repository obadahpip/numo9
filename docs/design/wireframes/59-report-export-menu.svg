<rect x="1060" y="156" width="356" height="220" rx="6" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1"/>
<text x="1080" y="184" font-size="14" fill="#111111" font-weight="600" text-anchor="start">PDF</text>
<text x="1080" y="202" font-size="11" fill="#5B6472" font-weight="400" text-anchor="start">Letter, 1 in margins, with the report header</text>
<text x="1080" y="232" font-size="14" fill="#111111" font-weight="600" text-anchor="start">Excel (.xlsx)</text>
<text x="1080" y="250" font-size="11" fill="#5B6472" font-weight="400" text-anchor="start">Formulas for totals</text>
<text x="1080" y="280" font-size="14" fill="#111111" font-weight="600" text-anchor="start">Google Sheets (.xlsx)</text>
<text x="1080" y="298" font-size="11" fill="#5B6472" font-weight="400" text-anchor="start">Opens in Google Sheets as it is</text>
