<text x="1080" y="346" font-size="11" fill="#5B6472" font-weight="400" text-anchor="start">Values only, one row per line</text>
<circle cx="1048" cy="176" r="11" fill="#FFD100" stroke="#111111" stroke-width="1.5"/>
<text x="1048" y="180" font-size="12" fill="#111111" font-weight="800" text-anchor="middle">1</text>
<text x="24" y="200" font-size="13" fill="#344054" font-weight="400" text-anchor="start">Exports carry exactly what the screen shows: the same parameters, layout, notes and header.</text>
<circle cx="24" cy="220" r="11" fill="#FFD100" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="224" font-size="12" fill="#111111" font-weight="800" text-anchor="middle">2</text>
