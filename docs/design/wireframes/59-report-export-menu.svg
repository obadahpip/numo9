<text x="24" y="92" font-size="12" fill="#5B6472" font-weight="400" text-anchor="start">Reports › Financial</text>
<text x="24" y="124" font-size="22" fill="#111111" font-weight="700" text-anchor="start">Profit and loss</text>
<rect x="1150" y="112" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1"/>
