<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Numo9 wireframe — Stop filing (danger zone)">
<title>Numo9 wireframe — Stop filing (danger zone)</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="0" y="0" width="1440" height="56" fill="#111111"/>
<rect x="16" y="12" width="32" height="32" rx="6" fill="#FFD100"/>
<text x="32" y="33" font-size="13" fill="#111111" font-weight="800" text-anchor="middle">N9</text>
<text x="60" y="33" font-size="14" fill="#FFFFFF" font-weight="700">Maple &amp; Pine Supply Co.</text>
<text x="716" y="33" font-size="13" fill="#FFD100" font-weight="700">Accounting</text>
<text x="24" y="92" font-size="12" fill="#5B6472">Settings › Tax › GST/HST 123456782 RT 0001</text>
<text x="24" y="124" font-size="22" fill="#111111" font-weight="700">GST/HST filing periods</text>
<rect x="24" y="150" width="1392" height="520" rx="8" fill="#FFFFFF" stroke="#B42318" stroke-width="1"/>
<text x="48" y="186" font-size="18" fill="#B42318" font-weight="700" text-anchor="start">Stop filing</text>
<circle cx="1390" cy="176" r="11" fill="#FFD100" stroke="#111111"/>
<text x="1390" y="180" font-size="12" fill="#111111" font-weight="800" text-anchor="middle">1</text>
<text x="48" y="212" font-size="13" fill="#344054" font-weight="400" text-anchor="start">Use this when the registration is cancelled, you become a small supplier, or the CRA suspends it. Filed periods are never changed.</text>
<text x="48" y="250" font-size="12" fill="#344054" font-weight="600" text-anchor="start">Last day registered</text>
<rect x="48" y="258" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1"/>
<text x="60" y="280" font-size="13" fill="#111111" font-weight="400" text-anchor="start">30 Jun 2026</text>
<text x="380" y="250" font-size="12" fill="#344054" font-weight="600" text-anchor="start">Reason</text>
<rect x="380" y="258" width="300" height="34" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1"/>
<text x="392" y="280" font-size="13" fill="#111111" font-weight="400" text-anchor="start">Deregistration ▾</text>
<text x="712" y="250" font-size="12" fill="#344054" font-weight="600" text-anchor="start">Note (kept in the history)</text>
<rect x="712" y="258" width="660" height="34" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1"/>
<text x="724" y="280" font-size="13" fill="#5B6472" font-weight="400" text-anchor="start">Business sold to Northern Tile Ltd.</text>
<circle cx="36" cy="330" r="11" fill="#FFD100" stroke="#111111"/>
<text x="36" y="334" font-size="12" fill="#111111" font-weight="800" text-anchor="middle">2</text>
<rect x="48" y="316" width="1324" height="150" rx="6" fill="#FEF3F2" stroke="#FDA29B" stroke-width="1"/>
<text x="64" y="344" font-size="14" fill="#111111" font-weight="700" text-anchor="start">What happens</text>
<text x="64" y="370" font-size="13" fill="#111111" font-weight="400" text-anchor="start">• The period 1 Apr – 30 Jun 2026 becomes your final return (ends on 30 Jun).</text>
<text x="64" y="394" font-size="13" fill="#111111" font-weight="400" text-anchor="start">• Periods after 30 Jun 2026 will be removed: Jul – Dec (2 quarters).</text>
<text x="64" y="418" font-size="13" fill="#B42318" font-weight="600" text-anchor="start">• 3 documents dated after 30 Jun use GST/HST codes → review them.</text>
<text x="64" y="442" font-size="13" fill="#111111" font-weight="400" text-anchor="start">• New sales after 30 Jun default to Out of scope (Tax settings › Defaults).</text>
<circle cx="36" cy="500" r="11" fill="#FFD100" stroke="#111111"/>
<text x="36" y="504" font-size="12" fill="#111111" font-weight="800" text-anchor="middle">3</text>
<text x="48" y="494" font-size="12" fill="#344054" font-weight="600" text-anchor="start">Type the registration number to confirm</text>
<rect x="48" y="502" width="420" height="34" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1"/>
<text x="60" y="524" font-size="13" fill="#5B6472" font-weight="400" text-anchor="start">123456782RT0001</text>
<rect x="1180" y="600" width="190" height="40" rx="6" fill="#B42318" stroke="#B42318" stroke-width="1"/>
<text x="1275" y="625" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Stop filing</text>
<rect x="1040" y="600" width="124" height="40" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1"/>
<text x="1102" y="625" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">Cancel</text>
<text x="48" y="625" font-size="12" fill="#5B6472" font-weight="400" text-anchor="start">The button stays disabled until the number matches.</text>
</svg>
