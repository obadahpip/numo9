<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Numo9 wireframe — Tax settings — not registered (G-06)">
<title>Numo9 wireframe — Tax settings — not registered (G-06)</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="0" y="0" width="1440" height="56" rx="0" fill="#111111" stroke="#111111" stroke-width="1"/>
<rect x="16" y="12" width="32" height="32" rx="6" fill="#FFD100" stroke="#FFD100" stroke-width="1"/>
<text x="32" y="33" font-size="13" fill="#111111" font-weight="800" text-anchor="middle">N9</text>
<text x="60" y="33" font-size="14" fill="#FFFFFF" font-weight="700">Maple &amp; Pine Supply Co.</text>
<text x="300" y="33" font-size="13" fill="#D0D5DD" font-weight="500" text-anchor="start">Home</text>
<text x="404" y="33" font-size="13" fill="#D0D5DD" font-weight="500" text-anchor="start">Sales</text>
<text x="508" y="33" font-size="13" fill="#D0D5DD" font-weight="500" text-anchor="start">Purchases</text>
<text x="612" y="33" font-size="13" fill="#D0D5DD" font-weight="500" text-anchor="start">Banking</text>
<text x="716" y="33" font-size="13" fill="#FFD100" font-weight="700" text-anchor="start">Accounting</text>
<rect x="716" y="52" width="56" height="4" rx="0" fill="#FFD100" stroke="#FFD100" stroke-width="1"/>
<text x="820" y="33" font-size="13" fill="#D0D5DD" font-weight="500" text-anchor="start">Contacts</text>
<text x="924" y="33" font-size="13" fill="#D0D5DD" font-weight="500" text-anchor="start">Reports</text>
<rect x="1100" y="14" width="240" height="28" rx="6" fill="#2A2F36" stroke="#3A4049" stroke-width="1"/>
<text x="1112" y="33" font-size="12" fill="#98A2B3" font-weight="400" text-anchor="start">Search or jump to…   Ctrl+K</text>
<text x="24" y="92" font-size="12" fill="#5B6472" font-weight="400" text-anchor="start">Settings › Tax</text>
<text x="24" y="124" font-size="22" fill="#111111" font-weight="700" text-anchor="start">Tax registrations &amp; settings</text>
<rect x="268" y="160" width="760" height="300" rx="8" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1"/>
<text x="648" y="230" font-size="20" fill="#111111" font-weight="700" text-anchor="middle">Not registered for GST/HST?</text>
<text x="648" y="266" font-size="13" fill="#344054" font-weight="400" text-anchor="middle">If your taxable sales stay under $30,000 over four calendar quarters, you're a</text>
<text x="648" y="288" font-size="13" fill="#344054" font-weight="400" text-anchor="middle">small supplier: you don't charge GST/HST and don't file returns.</text>
<text x="648" y="318" font-size="13" fill="#344054" font-weight="400" text-anchor="middle">Until you register, new sales and purchases use the out-of-scope code.</text>
<rect x="518" y="350" width="260" height="36" rx="6" fill="#FFD100" stroke="#111111" stroke-width="1"/>
<text x="648.0" y="373.0" font-size="13" fill="#111111" font-weight="700" text-anchor="middle">Add a GST/HST registration</text>
<text x="648" y="420" font-size="13" fill="#175CD3" font-weight="600" text-anchor="middle">Learn what registering changes</text>
<circle cx="1040" cy="160" r="11" fill="#FFD100" stroke="#111111" stroke-width="1.5"/>
<text x="1040" y="164" font-size="12" fill="#111111" font-weight="800" text-anchor="middle">1</text>
<rect x="268" y="480" width="760" height="70" rx="8" fill="#FFFAEB" stroke="#FEC84B" stroke-width="1"/>
<text x="288" y="510" font-size="13" fill="#B54708" font-weight="700" text-anchor="start">GST/HST is active but there's no business number yet.</text>
<text x="288" y="532" font-size="12" fill="#B54708" font-weight="400" text-anchor="start">Add the BN so returns and invoices can show it.</text>
<circle cx="1040" cy="480" r="11" fill="#FFD100" stroke="#111111" stroke-width="1.5"/>
<text x="1040" y="484" font-size="12" fill="#111111" font-weight="800" text-anchor="middle">2</text>
