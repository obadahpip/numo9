<text x="470" y="241" font-size="12" fill="#111111" font-weight="700" text-anchor="start">Keep  ◉  Maple Supply Ltd. (C-0002)</text>
<text x="820" y="241" font-size="12" fill="#5B6472" font-weight="700" text-anchor="start">Merge in  ○  Maple Suply (C-0042)</text>
<circle cx="238" cy="236" r="10" fill="#B42318"/>
<text x="238" y="240" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
