<text x="820" y="282" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ Maple Suply</text>
<line x1="248" y1="296" x2="1192" y2="296" stroke="#EBEDF0" stroke-width="1"/>
<text x="264" y="322" font-size="13" fill="#344054" font-weight="600" text-anchor="start">Legal name</text>
<text x="470" y="322" font-size="13" fill="#111111" font-weight="400" text-anchor="start">◉ Maple Supply Limited</text>
<text x="820" y="322" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ —</text>
<line x1="248" y1="336" x2="1192" y2="336" stroke="#EBEDF0" stroke-width="1"/>
<text x="264" y="362" font-size="13" fill="#344054" font-weight="600" text-anchor="start">Business Number</text>
<text x="470" y="362" font-size="13" fill="#111111" font-weight="400" text-anchor="start">◉ 123456782</text>
<text x="820" y="362" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ 123456782</text>
<line x1="248" y1="376" x2="1192" y2="376" stroke="#EBEDF0" stroke-width="1"/>
<text x="264" y="402" font-size="13" fill="#344054" font-weight="600" text-anchor="start">Email</text>
<text x="470" y="402" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ ap@maplesupply.ca</text>
<text x="820" y="402" font-size="13" fill="#111111" font-weight="400" text-anchor="start">◉ accounts@maplesupply.ca</text>
<line x1="248" y1="416" x2="1192" y2="416" stroke="#EBEDF0" stroke-width="1"/>
<text x="264" y="442" font-size="13" fill="#344054" font-weight="600" text-anchor="start">Roles</text>
<text x="470" y="442" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ Customer</text>
<text x="820" y="442" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ Customer · Supplier</text>
<text x="1080" y="442" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="start">◉ Both (union)</text>
<line x1="248" y1="456" x2="1192" y2="456" stroke="#EBEDF0" stroke-width="1"/>
<text x="264" y="482" font-size="13" fill="#344054" font-weight="600" text-anchor="start">Billing address</text>
<text x="470" y="482" font-size="13" fill="#111111" font-weight="400" text-anchor="start">◉ 200 King St W, Toronto ON</text>
<text x="820" y="482" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ —</text>
<line x1="248" y1="496" x2="1192" y2="496" stroke="#EBEDF0" stroke-width="1"/>
<text x="264" y="522" font-size="13" fill="#344054" font-weight="600" text-anchor="start">Currency</text>
<text x="470" y="522" font-size="13" fill="#111111" font-weight="400" text-anchor="start">◉ CAD</text>
<text x="820" y="522" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ CAD</text>
<line x1="248" y1="536" x2="1192" y2="536" stroke="#EBEDF0" stroke-width="1"/>
<text x="264" y="562" font-size="13" fill="#344054" font-weight="600" text-anchor="start">Credit limit</text>
<text x="470" y="562" font-size="13" fill="#111111" font-weight="400" text-anchor="start">◉ 10,000.00 · warn</text>
<text x="820" y="562" font-size="13" fill="#111111" font-weight="400" text-anchor="start">○ —</text>
<line x1="248" y1="576" x2="1192" y2="576" stroke="#EBEDF0" stroke-width="1"/>
<circle cx="238" cy="300" r="10" fill="#B42318"/>
<text x="238" y="304" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<rect x="248" y="592" width="944" height="112" rx="8" fill="#F5F7FA" stroke="#D0D5DD" stroke-width="1"/>
<text x="264" y="618" font-size="14" fill="#111111" font-weight="700" text-anchor="start">What moves to Maple Supply Ltd.</text>
<text x="264" y="642" font-size="13" fill="#344054" font-weight="400" text-anchor="start">7 invoices · 2 bills · 1 credit note · 14 journal lines · 3 people · 2 attachments</text>
<text x="264" y="666" font-size="13" fill="#344054" font-weight="400" text-anchor="start">C-0042 stays findable as an alias of C-0002; its history appears on the kept contact.</text>
<text x="264" y="688" font-size="12" fill="#5B6472" font-weight="400" text-anchor="start">One step: if anything fails, nothing changes.</text>
<circle cx="238" cy="614" r="10" fill="#B42318"/>
<text x="238" y="618" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<rect x="248" y="718" width="944" height="40" rx="6" fill="#FEF3F2" stroke="#B42318" stroke-width="1"/>
<text x="264" y="743" font-size="13" fill="#B42318" font-weight="500" text-anchor="start">Refused example: “These contacts use different currencies (CAD and USD) and can't be merged.”</text>
<circle cx="238" cy="738" r="10" fill="#B42318"/>
<text x="238" y="742" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<rect x="966" y="776" width="100" height="32" rx="6" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1"/>
<text x="1016.0" y="796.0" font-size="13" fill="#111111" font-weight="500" text-anchor="middle">Cancel</text>
<rect x="1076" y="776" width="116" height="32" rx="6" fill="#FFD100" stroke="#111111" stroke-width="1"/>
<text x="1134.0" y="796.0" font-size="13" fill="#111111" font-weight="600" text-anchor="middle">Merge</text>
<circle cx="1206" cy="792" r="10" fill="#B42318"/>
<text x="1206" y="796" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
