<text x="24" y="81" font-size="12" fill="#5B6472" font-weight="500" text-anchor="start">Maple Leaf Supply Ltd.  /  Contacts  /  Customers</text>
<text x="24" y="136" font-size="24" fill="#9AA1AC" font-weight="700" text-anchor="start">Customers</text>
<rect x="0" y="96" width="1440" height="804" rx="0" fill="#111111" fill-opacity="0.45" stroke="#111111" stroke-width="1"/>
<rect x="220" y="130" width="1000" height="700" rx="10" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1"/>
<text x="248" y="172" font-size="20" fill="#111111" font-weight="700" text-anchor="start">Merge contacts</text>
<text x="248" y="196" font-size="13" fill="#5B6472" font-weight="400" text-anchor="start">Choose the value to keep for each field. The other contact's documents, history and people move to the one you keep.</text>
<text x="1192" y="172" font-size="16" fill="#5B6472" font-weight="600" text-anchor="middle">✕</text>
