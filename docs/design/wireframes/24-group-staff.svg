<text x="40" y="195" font-size="13" fill="#111111" font-weight="600" text-anchor="start">Priya Shah</text>
<rect x="320" y="177" width="180" height="26" rx="6" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1"/>
