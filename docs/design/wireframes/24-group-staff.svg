<text x="24" y="92" font-size="20" fill="#111111" font-weight="700" text-anchor="start">Toronto office › Retail clients</text>
<text x="24" y="114" font-size="13" fill="#5B6472" font-weight="400" text-anchor="start">Staff assigned here can open every organisation in this group and its sub-groups — and any organisation added later.</text>
