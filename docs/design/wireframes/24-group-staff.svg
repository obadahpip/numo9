<text x="956" y="160" font-size="15" fill="#111111" font-weight="700" text-anchor="start">Delete “Retail clients”?</text>
<text x="956" y="188" font-size="13" fill="#111111" font-weight="400" text-anchor="start">24 organisations leave this group (they stay in the practice).</text>
<text x="956" y="210" font-size="13" fill="#111111" font-weight="400" text-anchor="start">2 sub-groups move up to “Toronto office”.</text>
<text x="956" y="232" font-size="13" fill="#111111" font-weight="400" text-anchor="start">2 staff assignments are removed: Priya Shah and Dana Roy</text>
<text x="956" y="252" font-size="13" fill="#111111" font-weight="400" text-anchor="start">lose access to 18 organisations they can't reach another way.</text>
<text x="956" y="284" font-size="12" fill="#5B6472" font-weight="600" text-anchor="start">Type the group name to confirm</text>
<rect x="956" y="292" width="444" height="34" rx="6" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1"/>
<rect x="1150" y="360" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1"/>
<text x="1205" y="383" font-size="13" fill="#111111" font-weight="600" text-anchor="middle">Keep group</text>
<rect x="1270" y="360" width="130" height="36" rx="6" fill="#B42318" stroke="#B42318" stroke-width="1"/>
<text x="1335" y="383" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Delete group</text>
<text x="24" y="470" font-size="13" fill="#5B6472" font-weight="400" text-anchor="start">Removing someone takes effect on their next request; an organisation they can still reach through another group or a direct assignment stays open to them.</text>
