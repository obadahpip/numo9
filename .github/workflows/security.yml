name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC — catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.30.0"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  pip-audit:
    name: pip-audit (backend dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/*.txt
            docs/requirements.txt
      - name: Install pip-audit
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"
      # S-03-T09: pip-audit writes JSON; scan_gate fails on any finding not on the justified
      # allow-list (.security-allowlist.toml) and on a missing report (pip-audit crashed).
      - name: Audit runtime + dev requirements
        run: |
          pip-audit -r backend/requirements/dev.txt --progress-spinner off --desc \
            -f json -o pip-audit-backend.json || true
          python3 tools/ci/scan_gate.py pip-audit pip-audit-backend.json

      - name: Audit documentation tooling (docs/requirements.txt)
        if: success() || failure()
        run: |
          pip-audit -r docs/requirements.txt --progress-spinner off --desc \
            -f json -o pip-audit-docs.json || true
          python3 tools/ci/scan_gate.py pip-audit pip-audit-docs.json

      - name: Upload pip-audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-reports
          path: pip-audit-*.json
          if-no-files-found: ignore

  npm-audit:
    name: npm audit (pnpm lockfile, fail on high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # S-03-T09: high/critical advisories fail unless allow-listed with a justification.
      - name: pnpm audit (gated by scan_gate, fail on high)
        run: |
          pnpm audit --json > pnpm-audit.json || true
          python3 tools/ci/scan_gate.py npm pnpm-audit.json --min-severity high
      - name: Upload pnpm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: ignore

  scan-allowlist:
    # S-03-T09: every accepted scanner finding has a justification, an owner and an expiry at
    # most 90 days ahead; an expired entry fails here (and in every scan job) until re-reviewed.
    name: scan allow-list (justified, not expired)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate .security-allowlist.toml
        run: python3 tools/ci/scan_gate.py validate

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan git history for secrets (default rules + .gitleaks.toml, S-03-T03)
        run: >-
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo
          --config /repo/.gitleaks.toml --redact --no-banner --verbose

  secrets:
    # S-03-T03: SOPS-encrypted environment files stay encrypted, recipients are public keys only,
    # no private key or .env file is committed; secrets.sh works end to end with throw-away keys.
    name: secrets (SOPS + age files encrypted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOPS_VERSION: v3.11.0
      SOPS_SHA256: 775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef
    steps:
      - uses: actions/checkout@v7
      - name: No plaintext secret files (tools/ci/check_secrets.py)
        run: python3 tools/ci/check_secrets.py .
      - name: Install sops (checksum-pinned) and age
        run: |
          curl -fsSL --retry 3 -o /tmp/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends age
      - name: secrets.sh end-to-end (keygen, edit, set, decrypt, deploy.sh, rotate)
        run: bash infra/secrets/tests/test_secrets.sh

  semgrep:
    name: semgrep (django, python, react, typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@v7
      - name: semgrep scan (fail on ERROR-severity findings)
        run: >-
          semgrep scan
          --config p/django
          --config p/python
          --config p/react
          --config p/typescript
          --severity ERROR
          --error
          --metrics off

  trivy:
    name: trivy (${{ matrix.image }} image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --target runtime -f "${{ matrix.dockerfile }}" -t "numo9-${{ matrix.image }}:ci" "${{ matrix.context }}"
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v6
        with:
          path: .trivy-cache
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Scan image (JSON report)
        # --ignore-unfixed: OS CVEs with no published fix cannot be remediated. Trivy writes the
        # report and exits 0; scan_gate decides (next step).
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivy-cache:/root/.cache"
          -v "$PWD:/out"
          "$TRIVY_IMAGE" image
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --scanners vuln,secret
          --format json
          --output "/out/trivy-${{ matrix.image }}.json"
          --exit-code 0
          --no-progress
          "numo9-${{ matrix.image }}:ci"
      - name: Gate (fail on fixable HIGH/CRITICAL or any secret not on the allow-list, S-03-T09)
        run: python3 tools/ci/scan_gate.py trivy "trivy-${{ matrix.image }}.json" --min-severity high
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image }}-report
          path: trivy-${{ matrix.image }}.json
          if-no-files-found: ignore
