name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.30.0"

jobs:
  backend:
    name: backend (ruff, mypy, pytest, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: numo9
          POSTGRES_USER: numo9
          POSTGRES_PASSWORD: numo9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U numo9 -d numo9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Celery worker test against a real broker (A-08-T01, tests/test_celery.py).
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Stripe API mock for the package price sync (U-02-T12, tests/test_packages_stripe_sync.py).
      stripe-mock:
        image: stripe/stripe-mock:v0.194.0
        ports:
          - 12111:12111
    env:
      DJANGO_SETTINGS_MODULE: numo9.settings.test
      DATABASE_URL: postgres://numo9:numo9@localhost:5432/numo9
      NUMO9_TEST_REDIS_URL: redis://localhost:6379/0
      NUMO9_TEST_STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # migration linter compares against the base branch

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Install Pango and fonts (WeasyPrint PDF documents, A-10-T16)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-inter fonts-dejavu-core

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/requirements/*.txt') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('backend/requirements/*.txt') }}-

      - name: ruff check
        run: ruff check --output-format=github . ../tools

      - name: ruff format
        run: ruff format --check . ../tools

      - name: mypy
        run: mypy .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Permission declarations — every endpoint method (A-03-T06)
        run: python manage.py permission_check

      - name: Permission catalogue docs page up to date (A-03-T16)
        run: |
          python tools/compile_messages.py --quiet
          python manage.py permcat_docs --check

      - name: Permission declarations — canary, an undeclared fixture view must fail (A-03-T06)
        run: |
          if python manage.py permission_check --quiet --urlconf tests.testapp.rbac_urls_ci_canary; then
            echo "::error::permission_check passed a URLconf with an undeclared endpoint — the gate is broken"
            exit 1
          fi

      - name: Migrate (the feature-key check reads the catalogue rows, U-01-T07)
        run: python manage.py migrate --noinput

      - name: Feature keys — every business endpoint declares a known key (U-01-T07)
        run: python manage.py check_feature_keys

      - name: Feature keys — canary, an undeclared business endpoint must fail (U-01-T07)
        run: |
          if python manage.py check_feature_keys --quiet --urlconf tests.testapp.feature_urls_ci_canary; then
            echo "::error::check_feature_keys passed a URLconf with an undeclared endpoint — the gate is broken"
            exit 1
          fi

      - name: Security settings — check --deploy, 0 warnings (staging, prod; S-03-T01, T04 keys)
        run: |
          for module in staging prod; do
            DJANGO_SETTINGS_MODULE="numo9.settings.$module" \
            DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            DJANGO_ALLOWED_HOSTS=app.numo9.ca DATABASE_URL=sqlite:///:memory: \
            NUMO9_FIELD_ENCRYPTION_KEYS="{\"ci\": \"$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')\"}" \
            NUMO9_FIELD_ENCRYPTION_ACTIVE_KEY=ci \
              python manage.py check --deploy --fail-level WARNING
          done

      - name: Migration linter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python manage.py lintmigrations --git-commit-id "origin/${{ github.base_ref }}"
          else
            python manage.py lintmigrations
          fi

      - name: pytest + coverage (PostgreSQL 16)
        run: >-
          pytest
          --cov=numo9
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Upload coverage and test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
          if-no-files-found: ignore

  frontend:
    name: frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/*.ts', 'frontend/*.mjs', 'packages/ui/src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: design tokens up to date (@numo9/ui)
        run: pnpm --filter @numo9/ui run tokens:check

      - name: token contrast ≥ 4.5:1 (@numo9/ui, A-10-T04)
        run: pnpm --filter @numo9/ui run contrast

      - name: tsc (@numo9/ui)
        run: pnpm --filter @numo9/ui run typecheck

      - name: vitest (@numo9/ui)
        run: pnpm --filter @numo9/ui run test

      - name: Storybook build (@numo9/ui)
        run: pnpm --filter @numo9/ui run build-storybook

      - name: eslint (incl. numo9/no-work-screen-banners, A-10-T17 gap-12)
        run: pnpm --filter @numo9/frontend run lint

      - name: prettier
        run: pnpm run format:check

      - name: tsc
        run: pnpm --filter @numo9/frontend run typecheck

      - name: vitest
        run: pnpm --filter @numo9/frontend run test

      - name: next build
        run: pnpm --filter @numo9/frontend run build

      - name: Install Playwright Chromium
        run: pnpm --filter @numo9/frontend exec playwright install --with-deps chromium

      - name: Playwright (gap-02 redirect crawl, A-10-T05 shell 360–1440 px, A-01-T14 org switcher, gap-12 no banners, A-10-T19 axe + gap-60, S-03-T02 CSP, S-03-T10 headers)
        run: pnpm --filter @numo9/frontend run test:e2e

      - name: Playwright (@numo9/ui on the built Storybook — A-10-T10 DataGrid 10k rows at 60 fps, A-10-T19 axe + gap-60 on every story)
        run: pnpm --filter @numo9/ui run test:e2e

  visual:
    # A-10-T18: visual regression — every @numo9/ui story (built Storybook) and every Phase 0 page
    # (Next.js production build) against the committed Linux baselines. Pinned Ubuntu 24.04 +
    # fonts-inter so text renders with the same font files the baselines were made with.
    # New baselines: run the "Visual baselines" workflow and commit its artefact after review.
    name: visual (Playwright screenshots, components + Phase 0 pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install fonts (Inter, DejaVu) used by the baselines
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-inter fonts-dejavu-core

      - name: Install Playwright Chromium
        run: pnpm --filter @numo9/frontend exec playwright install --with-deps chromium

      - name: Storybook build (@numo9/ui)
        run: pnpm --filter @numo9/ui run build-storybook

      - name: next build
        run: pnpm --filter @numo9/frontend run build

      - name: Visual regression — components (@numo9/ui stories)
        run: pnpm --filter @numo9/ui run test:visual

      - name: Visual regression — Phase 0 pages
        if: success() || failure()
        run: pnpm --filter @numo9/frontend run test:visual

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            packages/ui/test-results
            frontend/test-results
          if-no-files-found: ignore

  docs:
    name: docs (mkdocs build --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: mkdocs build --strict
        run: mkdocs build --strict

  infra:
    # S-02-T02: OpenTofu fmt/validate/test (mocked hcloud provider, no credentials) and the
    # ADR-0002 location fitness check (only Hetzner hel1 / fsn1 may appear under infra/).
    name: infra (opentofu, ADR-0002 locations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOFU_VERSION: "1.13.9"
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Location fitness check (ADR-0002)
        run: python tools/ci/check_infra_locations.py infra

      - name: Location check unit tests
        run: |
          pip install pytest==9.2.0
          python -m pytest -q tools/tests

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -recursive -check -diff infra/terraform

      - name: tofu validate + test (modules and environments)
        run: |
          set -euo pipefail
          for dir in infra/terraform/modules/* infra/terraform/environments/*; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            if [ -d "$dir/tests" ]; then tofu -chdir="$dir" test; fi
            echo "::endgroup::"
          done

  tenant-sweep:
    # A-01-T09: router sweep over every URL of the real URLconf (`manage.py tenant_sweep`: each
    # organisation-scoped endpoint requested as another organisation's user, every verb -> 404)
    # plus the tests marked @pytest.mark.tenant_isolation.
    name: tenant-sweep (isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: numo9
          POSTGRES_USER: numo9
          POSTGRES_PASSWORD: numo9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U numo9 -d numo9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: numo9.settings.test
      DATABASE_URL: postgres://numo9:numo9@localhost:5432/numo9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements/dev.txt
      - name: Migrate
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Router sweep (manage.py tenant_sweep)
        working-directory: backend
        run: python manage.py tenant_sweep
      - name: Tenant isolation tests (marker tenant_isolation)
        run: bash tools/ci/pytest_marker.sh tenant_isolation -v

  gap-tests:
    # Placeholder (S-01-T11): runs tests marked @pytest.mark.gap("gap-NN") and passes while none
    # exist. Playwright gap specs (e.g. gap-02, S-01-T14) are added to this job when they land.
    name: gap-tests (xero_teardown gaps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL like the backend job: gap tests write audit events (A-04: sequence, append-only
    # trigger and advisory-lock hash chain exist on PostgreSQL only).
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: numo9
          POSTGRES_USER: numo9
          POSTGRES_PASSWORD: numo9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U numo9 -d numo9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: numo9.settings.test
      DATABASE_URL: postgres://numo9:numo9@localhost:5432/numo9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements/dev.txt
      - name: Install Pango and fonts (WeasyPrint, gap-43 document tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-inter fonts-dejavu-core
      - name: Gap-closure tests (marker gap)
        run: bash tools/ci/pytest_marker.sh gap -v

  i18n:
    name: i18n (formatjs, makemessages, glossary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: numo9.settings.test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install GNU gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gettext

      - name: Install backend dependencies
        run: pip install -r backend/requirements/dev.txt

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: No hard-coded strings (eslint formatjs rules)
        run: pnpm --filter @numo9/frontend run lint:i18n

      - name: FormatJS extract
        run: pnpm --filter @numo9/frontend run i18n:extract

      - name: Frontend catalogues complete (en-CA, fr-CA)
        run: python backend/tools/check_i18n.py frontend --extracted frontend/.i18n/extracted.json

      - name: Django makemessages + backend catalogues complete (en_CA, fr_CA)
        run: |
          cp -r backend/locale "$RUNNER_TEMP/locale-committed"
          (cd backend && python manage.py makemessages -l en_CA -l fr_CA --no-location --no-wrap)
          python backend/tools/check_i18n.py backend \
            --committed "$RUNNER_TEMP/locale-committed" --generated backend/locale

      - name: Glossary lint (catalogues + design-system stories/fixtures, gap-31/gap-38)
        run: python backend/tools/check_glossary.py
