name: Deploy staging

# A release tag vX.Y.Z (or vX.Y.Z-rc.N) builds both runtime images, pushes them to GHCR and deploys
# them to staging with a health gate and automatic rollback (infra/deploy/deploy.sh).
# Mobile release tags (mobile-vX.Y.Z) do not match and never trigger this workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never interrupt a deploy midway

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/numo9

jobs:
  images:
    name: build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z[-pre]"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=numo9-${{ matrix.image }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

  deploy:
    name: deploy to staging
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.ref_name }}
      SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      # Optional: "cloudflared" when the host is reached through a Cloudflare tunnel (temporary
      # local staging host, infra/staging-local). Empty for a directly reachable VM.
      SSH_PROXY: ${{ vars.STAGING_SSH_PROXY }}
      CLOUDFLARED_VERSION: "2026.10.7"
      APP_DIR: ${{ vars.STAGING_APP_DIR }}
      HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Check staging configuration
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER APP_DIR HEALTH_URL SSH_KEY KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error::staging environment is not configured; missing: ${missing[*]} (see infra/deploy/README.md)"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          {
            printf 'Host staging\n  HostName %s\n  Port %s\n  User %s\n' "$SSH_HOST" "$SSH_PORT" "$SSH_USER"
            printf '  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n'
            printf '  HostKeyAlias %s\n' "$SSH_HOST"
            if [[ "$SSH_PROXY" == "cloudflared" ]]; then
              printf '  ProxyCommand cloudflared access ssh --hostname %%h\n'
            fi
          } > ~/.ssh/config

      - name: Install cloudflared (tunnelled host only)
        if: env.SSH_PROXY == 'cloudflared'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Upload deploy script
        run: scp -q infra/deploy/deploy.sh "staging:$APP_DIR/deploy.sh"

      - name: Deploy ${{ github.ref_name }} (migrate, health gate, rollback on failure)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # Values below are expanded on the runner on purpose and passed to the host (SC2029).
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh staging "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # shellcheck disable=SC2029
          ssh staging "cd '$APP_DIR' && HEALTH_URL='$HEALTH_URL' bash deploy.sh '$TAG'"

      - name: Log out of GHCR on host
        if: always()
        run: ssh staging "docker logout ghcr.io" || true
